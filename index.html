    <title>Oblivion 1 Fitness Club (O1FC)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <meta property="og:image" content="/mobile-preview-v17.webp">
    <meta property="og:image:alt" content="O1FC Oblivion Fitness Club app preview">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="/mobile-preview-v17.webp">

    <script>
      // Pre-mount theme application — prevents FOUC on cold boot across Android and iOS
      (function() {
        var theme = 'dark';
        try { 
          var s = localStorage.getItem('o1fc_theme_preference') || 
                  localStorage.getItem('o1fc_theme') || 
                  localStorage.getItem('theme'); 
          if (s === 'light' || s === 'dark') theme = s;
          else if (s === 'system') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch(e) {}
        var html = document.documentElement;
        var isDark = theme === 'dark';
        if (isDark) {
          html.classList.add('dark');
          html.style.backgroundColor = '#000000';
        } else {
          html.classList.remove('dark');
          html.style.backgroundColor = '#FFFFFF';
        }
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', isDark ? '#000000' : '#FFFFFF');
        }
        document.addEventListener('DOMContentLoaded', function() {
          if (document.body) {
            document.body.style.backgroundColor = isDark ? '#000000' : '#FFFFFF';
            if (isDark) {
              document.body.classList.add('dark');
            } else {
              document.body.classList.remove('dark');
            }
          }
        });
      })();
    </script>
    <style>
      /* Prevent flash: solid background before CSS loads */
      html { background-color: #FFFFFF; }
      html.dark { background-color: #000000; }
      #root { background-color: inherit; min-height: 100dvh; }
    </style>
</head>
  <body class="bg-[#F8F9FA] dark:bg-[#000000] text-zinc-900 dark:text-white font-sans antialiased selection:bg-red-500/20 selection:text-red-600">

    <script type="module" src="/src/main.tsx"></script>
