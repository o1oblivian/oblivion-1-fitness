// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // OneDrive locks build folders under the repo on the Windows dev laptop only.
    // CI (macOS/Linux) must keep the default build folder, or generated R classes are lost.
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        layout.buildDirectory.set(file("C:/o1build/${name}"))
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
