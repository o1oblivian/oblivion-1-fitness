apply plugin: 'com.android.application'

android {
    namespace "com.o1fc.fitness"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.o1fc.fitness"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 70
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (file('release-keystore.jks').exists()) {
                storeFile file('release-keystore.jks')
                storePassword 'o1fcfitness'
                keyAlias 'o1fc'
                keyPassword 'o1fcfitness'
            } else {
                def ksPath = System.getenv("CM_KEYSTORE") ?: System.getenv("KEYSTORE_PATH")
                if (ksPath != null && file(ksPath).exists()) {
                    storeFile file(ksPath)
                    storePassword System.getenv("CM_KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD") ?: "o1fcfitness"
                    keyAlias System.getenv("CM_KEY_ALIAS") ?: System.getenv("KEY_ALIAS") ?: "o1fc"
                    keyPassword System.getenv("CM_KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD") ?: "o1fcfitness"
                }
            }
        }
    }
    buildTypes {
        release {
            if (file('release-keystore.jks').exists() || System.getenv("CM_KEYSTORE") != null || System.getenv("KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
