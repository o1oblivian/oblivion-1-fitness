# Typecheck on push. Signing, AAB, and IPA builds stay in codemagic.yaml.
name: Check

on:
  push:
    branches: [main, master, cleanup/grade-a]
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit
