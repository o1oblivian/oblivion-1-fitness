name: Build & Release Android (O1FC Official)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npx vite build

      - name: Ensure Android Platform Exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug APK & Release APK / AAB
        working-directory: android
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: o1fc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: o1fc-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14

      - name: Upload Google Play Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: o1fc-google-play-bundle-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Generate Release Tag
        id: tag_gen
        run: |
          TAG_NAME="release-$(date +'%Y.%m.%d-%H%M%S')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: "O1FC Official Build ${{ steps.tag_gen.outputs.TAG_NAME }}"
          body: "Automated Android APK & Google Play AAB bundle generated from GitHub push."
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


