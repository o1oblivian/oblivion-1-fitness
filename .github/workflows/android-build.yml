# ==============================================================================
# O1FC Android build: checks the code, then builds an installable debug APK and,
# when the signing keystore secret is present, a signed release AAB for Google Play.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APP_ENV_FILE            full contents of the local .env used for production builds
#   ANDROID_KEYSTORE_BASE64 base64 of android/app/release-keystore.jks (the Play upload key)
# ==============================================================================
name: Android build

on:
  push:
    branches: [main, master, cleanup/grade-a]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --experimental-strip-types

jobs:
  build:
    name: Check, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx oxlint src server

      - name: Tests
        run: npx vitest run

      - name: Write production environment
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          if [ -z "$APP_ENV_FILE" ]; then
            echo "::error::APP_ENV_FILE secret is missing. The app would build without its backend settings."
            exit 1
          fi
          printf '%s\n' "$APP_ENV_FILE" > .env.production.local

      - name: Build web app
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Restore release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing, so only the debug APK is built."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release AAB and APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Remove keystore and environment from the runner
        if: always()
        run: rm -f android/app/release-keystore.jks .env.production.local

      - name: Name the build
        id: meta
        run: |
          VERSION=$(grep -m1 "versionName" android/app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=build-${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "o1fc-${VERSION}-${GITHUB_RUN_NUMBER}-debug.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "o1fc-${VERSION}-${GITHUB_RUN_NUMBER}-release.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "o1fc-${VERSION}-${GITHUB_RUN_NUMBER}-release.apk"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: o1fc-${{ steps.meta.outputs.tag }}
          path: o1fc-*.a*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: O1FC ${{ steps.meta.outputs.version }} (build ${{ github.run_number }}, ${{ github.ref_name }})
          body: |
            Built from `${{ github.ref_name }}` at ${{ github.sha }}.
            Install `-release.apk` on a phone to test (it updates in place over earlier release builds).
            Upload `-release.aab` to Google Play. `-debug.apk` is a fallback when no keystore secret is set.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: o1fc-*.a*
