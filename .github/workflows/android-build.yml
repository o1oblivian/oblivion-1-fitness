# ==============================================================================
# PRODUCTION CI/CD WORKFLOW (O1FC Android Official)
# ==============================================================================
name: Build & Release Android (O1FC Official)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npx vite build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL || '' }}

      - name: Ensure Android Platform Exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "android/gradlew" ]; then
            tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradlew gradlew.bat gradle build.gradle settings.gradle variables.gradle gradle.properties 2>/dev/null || true
          fi
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Bundle and APK
        working-directory: android
        run: |
          ./gradlew bundleRelease --stacktrace || true
          ./gradlew assembleRelease --stacktrace || true
          ./gradlew assembleDebug --stacktrace || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: o1fc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: o1fc-release-aab
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 14

      - name: Generate Release Tag
        id: tag_gen
        run: |
          TAG_NAME="release-$(date +'%Y.%m.%d-%H%M%S')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: "O1FC Official Build ${{ steps.tag_gen.outputs.TAG_NAME }}"
          body: "Automated Android release generated from GitHub push. Includes production bundle (.aab) and APK."
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
