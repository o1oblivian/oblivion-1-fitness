workflows:
  android-release:
    name: Android Release (Google Play AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_play_credentials
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web bundle and copy Android assets
        script: |
          npm run build
          npx cap copy android
      - name: Build Android Release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_KEY
        track: internal
        submit_as_draft: true

  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.oblivion1.fitness"
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web bundle and copy iOS assets
        script: |
          npm run build
          npx cap copy ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set up code signing with App Store Connect API
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
