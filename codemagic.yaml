workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.o1fc.fitness"
      xcode: latest
      cocoapods: default
      node: 22
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          else
            echo "Swift Package Manager in use; skipping CocoaPods."
          fi
      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj
      - name: Set up code signing
        script: |
          keychain initialize
          
          mkdir -p ~/.appstoreconnect/private_keys
          AUTH_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"

          echo "Attempting to fetch or create signing files for $BUNDLE_ID from Apple Developer Portal..."
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$AUTH_KEY_PATH" || true

          keychain add-certificates || true

          # Check if a profile was obtained; if so, configure Xcode for manual profile signing.
          PROFILES_COUNT=$(ls -1 ~/Library/MobileDevice/"Provisioning Profiles" 2>/dev/null | wc -l || echo 0)
          echo "Found $PROFILES_COUNT provisioning profile(s) in system."
          if [ "$PROFILES_COUNT" -gt 0 ]; then
            echo "Applying profiles to Xcode project..."
            xcode-project use-profiles --project ios/App/App.xcodeproj
          else
            echo "No provisioning profile fetched. Building with automatic/development signing."
          fi

      - name: Build iOS IPA
        script: |
          set -e
          PROFILES_COUNT=$(ls -1 ~/Library/MobileDevice/"Provisioning Profiles" 2>/dev/null | wc -l || echo 0)
          if [ "$PROFILES_COUNT" -gt 0 ]; then
            echo "Building signed App Store IPA with profiles..."
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme "App"
          else
            echo "Building archive without manual profiles (Xcode automatic signing / archive)..."
            xcodebuild archive \
              -project ios/App/App.xcodeproj \
              -scheme "App" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/ios/xcarchive/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO
            echo "Native iOS archive generated successfully at build/ios/xcarchive/App.xcarchive"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/**
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - o1oblivianfitness@gmail.com
        notify:
          success: true
          failure: true
