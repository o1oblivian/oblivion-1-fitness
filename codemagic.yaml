workflows:
  ios-app-store:
    name: Oblivion 1 - iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.14.0
      xcode: 16.0
      cocoapods: default
      groups:
        - app_store_credentials # Requires: APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, CERTIFICATE_PRIVATE_KEY
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          cd ios/App
          keychain initialize
          BUNDLE_ID=$(xcode-project detect-bundle-id --project App.xcodeproj 2>/dev/null || echo "com.o1fc.fitness")
          [ -z "$BUNDLE_ID" ] && BUNDLE_ID="com.o1fc.fitness"
          echo "Signing with Bundle ID: $BUNDLE_ID"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project App.xcodeproj
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build iOS IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"
    artifacts:
      - "**/*.ipa"
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  android-google-play:
    name: Oblivion 1 - Android Release
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 22.14.0
      java: 21
      groups:
        - google_play_credentials # Requires: GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build and Sign Android AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          
          # Sign the generated AAB if keystore exists or sign with release key
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "Signing Android App Bundle..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore ~/.android/debug.keystore -storepass android -keypass android \
              "$AAB_PATH" androiddebugkey || true
          fi
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
