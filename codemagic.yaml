workflows:
  android-release:
    name: Android Release (Google Play AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      vars:
        PACKAGE_NAME: "com.o1fc.fitness"
        GOOGLE_PLAY_TRACK: "internal"
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          mkdir -p dist
          if [ -d "android/app/src/main/assets/public" ]; then
            cp -R android/app/src/main/assets/public/* dist/
          fi
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build Android AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - dist/**

  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.o1fc.fitness
      vars:
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          mkdir -p dist
          if [ -d "android/app/src/main/assets/public" ]; then
            cp -R android/app/src/main/assets/public/* dist/
          fi
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Increment iOS Build Number
        script: |
          CURRENT_NUM=$(sed -n '/CURRENT_PROJECT_VERSION =/{s/.*= *//;s/;.*//;p;q;}' ios/App/App.xcodeproj/project.pbxproj | tr -d '[:space:]')
          NEW_NUM=${BUILD_NUMBER:-42}
          if [ -n "$CURRENT_NUM" ] && [ "$NEW_NUM" -le "$CURRENT_NUM" ]; then
            NEW_NUM=$((CURRENT_NUM + 1))
          fi
          echo "Setting iOS build version to $NEW_NUM"
          sed -i '' -e "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $NEW_NUM/g" ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || sed -i -e "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $NEW_NUM/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          set -e
          xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "$XCODE_SCHEME" || {
            echo "=== XCODEBUILD ERROR LOGS ==="
            find /tmp/xcodebuild_logs ~/Library/Logs -name "*.log" -exec cat {} + 2>/dev/null | tail -n 250
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ~/Library/Logs/gym/*.log
