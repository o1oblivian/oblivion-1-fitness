workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.o1fc.fitness"
      xcode: latest
      cocoapods: default
      node: 22
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          else
            echo "Swift Package Manager in use; skipping CocoaPods."
          fi
      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj
      - name: Set up code signing
        script: |
          keychain initialize
          
          mkdir -p ~/.appstoreconnect/private_keys
          AUTH_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          
          # Ensure private key is properly formatted with newlines whether it has literal \n or raw newlines
          printf "%b\n" "$APP_STORE_CONNECT_PRIVATE_KEY" | sed 's/\\n/\n/g' > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"

          echo "Fetching or creating signing files for $BUNDLE_ID from Apple Developer Portal..."
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$AUTH_KEY_PATH"

          keychain add-certificates

          echo "Configuring Xcode project profiles..."
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build iOS IPA
        script: |
          set -e
          echo "Building signed App Store IPA for publishing..."
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/**
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - o1oblivianfitness@gmail.com
        notify:
          success: true
          failure: true
