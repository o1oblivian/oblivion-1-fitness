workflows:
  web-and-capacitor-build:
    name: Web and Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      groups:
        - google_play_credentials
        - app_store_credentials
      vars:
        PACKAGE_NAME: "com.o1fc.fitness"
        BUNDLE_ID: "com.o1fc.fitness"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor iOS & Android
        script: |
          npx cap sync || true
      - name: Build Android Release AAB
        script: |
          if [ -d "android" ]; then
            cd android
            gradle bundleRelease || ./gradlew bundleRelease || true
          fi
      - name: Build iOS IPA
        script: |
          if [ -d "ios" ]; then
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" || true
          fi
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - build/ios/ipa/*.ipa
      - dist/**
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
      app_store_connect:
        auth: integration
        submit_to_testflight: true
