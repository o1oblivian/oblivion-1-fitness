workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods (if Podfile exists)
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          else
            echo "Swift Package Manager (SPM) detected; skipping CocoaPods installation."
          fi
      - name: Set up code signing
        script: |
          xcode-project use-profiles || echo "Skipping profile installation"
      - name: Build iOS App
        script: |
          if [ -d "$CM_BUILD_DIR/ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
              --scheme "App"
          else
            xcode-project build-ipa \
              --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
              --scheme "App"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - o1oblivianfitness@gmail.com
        notify:
          success: true
          failure: true
