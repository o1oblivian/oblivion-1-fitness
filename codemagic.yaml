workflows:
  web-and-capacitor-build:
    name: Oblivion 1 Fitness Club - Build & Deploy
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    environment:
      node: 20.x
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build Web Application
        script: |
          npm run build
    artifacts:
      - dist/**
