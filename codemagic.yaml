workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.o1fc.fitness"
      xcode: latest
      cocoapods: default
      node: 22
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          else
            echo "Swift Package Manager in use; skipping CocoaPods."
          fi
      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj
      - name: Set up code signing
        script: |
          echo "Fetching profiles from App Store Connect..."
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          PROJECT_ARG="--project $CM_BUILD_DIR/ios/App/App.xcodeproj"
          if [ -d "$CM_BUILD_DIR/ios/App/App.xcworkspace" ]; then
            PROJECT_ARG="--workspace $CM_BUILD_DIR/ios/App/App.xcworkspace"
          fi
          echo "Building signed iOS IPA for App Store / TestFlight..."
          xcode-project build-ipa $PROJECT_ARG --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - o1oblivianfitness@gmail.com
        notify:
          success: true
          failure: true
