workflows:
  android-release:
    name: Android Release (Google Play AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      vars:
        PACKAGE_NAME: "com.o1fc.fitness"
        GOOGLE_PLAY_TRACK: "internal"
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          mkdir -p dist
          if [ -d "android/app/src/main/assets/public" ]; then
            cp -R android/app/src/main/assets/public/* dist/
          fi
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build Android AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - dist/**

  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.o1fc.fitness
      vars:
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          mkdir -p dist
          if [ -d "android/app/src/main/assets/public" ]; then
            cp -R android/app/src/main/assets/public/* dist/
          fi
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment iOS Build Number
        script: |
          cd ios/App
          CURRENT_NUM=$(sed -n '/CURRENT_PROJECT_VERSION =/{s/.*= *//;s/;.*//;p;q;}' App.xcodeproj/project.pbxproj | tr -d '[:space:]')
          NEW_NUM=${BUILD_NUMBER:-42}
          if [ -n "$CURRENT_NUM" ] && [ "$NEW_NUM" -le "$CURRENT_NUM" ]; then
            NEW_NUM=$((CURRENT_NUM + 1))
          fi
          echo "Setting iOS build version to $NEW_NUM"
          agvtool new-version -all "$NEW_NUM"
      - name: Build iOS IPA
        script: |
          set -e
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "$XCODE_SCHEME" --archive-flags="-destination 'generic/platform=iOS'"
          else
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "$XCODE_SCHEME" --archive-flags="-destination 'generic/platform=iOS'"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
