workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.o1fc.fitness"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods (if Podfile exists)
        script: |
          cd ios/App
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi
      - name: Set up code signing
        script: |
          keychain initialize
          if [ -n "$CERT_P12" ]; then
            echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
            keychain add-certificates --certificate /tmp/cert.p12 ${CERT_PASSWORD:+--certificate-password "$CERT_PASSWORD"}
          fi
          if [ -n "$PROFILE_BASE64" ]; then
            PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILES_HOME"
            echo "$PROFILE_BASE64" | base64 --decode > "$PROFILES_HOME/app.mobileprovision"
          fi
          xcode-project use-profiles
      - name: Build iOS App
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - o1oblivianfitness@gmail.com
        notify:
          failure: true
          success: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
